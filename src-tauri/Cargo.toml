[package]
name = "ailexsi-resonance-studio-v6-0"
version = "6.0.0"
description = "AILEXSI Resonance Studio V6.0 standalone"
authors = ["AILEXSI"]
edition = "2021"

[lib]
name = "ailexsi_resonance_studio_v6_0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-fs = "2.4"
tauri-plugin-dialog = "2.4"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
